<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Hub</title>
    <style>
      /* Loading Screen Styles - Inline for immediate display */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
      }
      
      #splash-screen .logo {
        font-size: 2.5rem;
        font-weight: bold;
        color: white;
        margin-bottom: 2rem;
        letter-spacing: 0.05em;
      }
      
      #splash-screen .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      #splash-screen .loading-text {
        color: white;
        font-size: 1rem;
        margin-top: 1.5rem;
        opacity: 0.9;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash Screen - Displayed immediately while React loads -->
      <div id="splash-screen">
        <div class="logo">Supply Hub</div>
        <div class="spinner"></div>
        <p class="loading-text">Loading application...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
